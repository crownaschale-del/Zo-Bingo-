<!DOCTYPE html>
<html>
<head>
    <title>Beteseb Bingo Test</title>
</head>
<body>

<h2>🎱 Beteseb Bingo Backend Test</h2>

<button onclick="createRoom()">CREATE ROOM</button>

<p id="result"></p>

<script>

async function createRoom() {

    const response = await fetch(
        "https://zo-bingo.onrender.com/api/create-room",
        {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            }
        }
    );

    const data = await response.json();

    document.getElementById("result").textContent =
        JSON.stringify(data);
}

</script>

</body>
</html>
