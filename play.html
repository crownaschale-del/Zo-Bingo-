<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZO BINGO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:linear-gradient(135deg,#090b18,#15102b);
    color:white;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    padding:8px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:4px 8px;
}

.logo{
    font-size:20px;
    font-weight:900;
}

.round{
    color:#aaa4bc;
    font-size:12px;
}

.winner-box{
    min-height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    border-radius:10px;
    margin:5px 0;
    background:#1c1830;
    border:1px solid #342d55;
    color:#facc15;
    font-weight:bold;
}

.board{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
    margin:5px 0;
}

.column{
    text-align:center;
    font-weight:900;
    color:#facc15;
    font-size:14px;
}

.number{
    margin-top:4px;
    height:34px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:7px;
    background:#25213a;
    border:1px solid #40395d;
    font-size:13px;
    font-weight:bold;
}

.number.called{
    background:#eab308;
    color:#111827;
    border-color:#fde047;
}

.big-area{
    display:flex;
    justify-content:center;
    align-items:center;
    margin:5px 0;
}

.big-ball{
    width:62px;
    height:62px;
    border-radius:50%;
    background:#eab308;
    color:#111827;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:900;
    border:4px solid #fde047;
}

.mode-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#1c1830;
    border:1px solid #342d55;
    border-radius:9px;
    padding:8px 10px;
    margin:5px 0;
}

.switch{
    width:44px;
    height:24px;
    border-radius:20px;
    background:#4b5563;
    padding:3px;
}

.switch.on{
    background:#eab308;
}

.switch-dot{
    width:18px;
    height:18px;
    border-radius:50%;
    background:white;
}

.switch.on .switch-dot{
    margin-left:20px;
}

.card-area{
    flex:1;
    min-height:0;
    overflow:hidden;
    background:#161228;
    border:1px solid #30294c;
    border-radius:10px;
    padding:6px;
}

.watch{
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    color:#aaa4bc;
    font-size:14px;
}

.bingo-card{
    width:100%;
    height:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.bingo-card th{
    height:25px;
    color:#facc15;
    background:#292342;
}

.bingo-card td{
    border:1px solid #40395d;
    text-align:center;
    font-weight:bold;
    font-size:13px;
    background:#25213a;
}

.bingo-card td.marked{
    background:#eab308;
    color:#111827;
}

.bingo-card td.free{
    background:#eab308;
    color:#111827;
}

.bottom{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:5px;
    margin-top:6px;
}

.bottom button{
    border:0;
    border-radius:8px;
    padding:9px 4px;
    font-weight:bold;
    color:white;
    background:#30294c;
}

.bottom .leave{
    background:#991b1b;
}

.bottom .auto-button{
    background:#7c3aed;
}

.winner{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(5,5,12,.95);
    z-index:20;
    align-items:center;
    justify-content:center;
    text-align:center;
}

.winner.show{
    display:flex;
}

.winner-box{
    padding:30px;
}

.winner-icon{
    font-size:55px;
}

.winner-box h1{
    color:#facc15;
    margin:8px 0;
}

.countdown{
    color:#aaa4bc;
    margin-top:15px;
}

@media(max-height:650px){
    .number{
        height:29px;
    }

    .big-ball{
        width:52px;
        height:52px;
        font-size:20px;
    }

    .bingo-card th{
        height:21px;
    }

    .bottom button{
        padding:7px 3px;
    }
}
</style>
</head>

<body>

<div class="app">

    <div class="header">
        <div class="logo">🎱 ZO BINGO</div>
        <div class="round" id="gameId">ZO-R-</div>
    </div>

    <div class="winner-box" id="statusBox">
        Waiting for game...
    </div>

    <div class="board">

        <div>
            <div class="column">B</div>
            <div class="number" id="b1">-</div>
            <div class="number" id="b2">-</div>
            <div class="number" id="b3">-</div>
            <div class="number" id="b4">-</div>
            <div class="number" id="b5">-</div>
        </div>

        <div>
            <div class="column">I</div>
            <div class="number" id="i1">-</div>
            <div class="number" id="i2">-</div>
            <div class="number" id="i3">-</div>
            <div class="number" id="i4">-</div>
            <div class="number" id="i5">-</div>
        </div>

        <div>
            <div class="column">N</div>
            <div class="number" id="n1">-</div>
            <div class="number" id="n2">-</div>
            <div class="number" id="n3">-</div>
            <div class="number" id="n4">-</div>
            <div class="number" id="n5">-</div>
        </div>

        <div>
            <div class="column">G</div>
            <div class="number" id="g1">-</div>
            <div class="number" id="g2">-</div>
            <div class="number" id="g3">-</div>
            <div class="number" id="g4">-</div>
            <div class="number" id="g5">-</div>
        </div>

        <div>
            <div class="column">O</div>
            <div class="number" id="o1">-</div>
            <div class="number" id="o2">-</div>
            <div class="number" id="o3">-</div>
            <div class="number" id="o4">-</div>
            <div class="number" id="o5">-</div>
        </div>

    </div>

    <div class="big-area">
        <div class="big-ball" id="bigBall">-</div>
    </div>

    <div class="mode-row" id="modeRow">
        <span>Automatic</span>

        <div
            class="switch on"
            id="autoSwitch"
            role="button"
            aria-label="Automatic mode"
        >
            <div class="switch-dot"></div>
        </div>
    </div>

    <div
        id="cardArea"
        class="card-area"
    ></div>

    <div class="bottom">

        <button
            class="leave"
            id="leaveBtn"
            type="button"
        >
            Leave
        </button>

        <button
            class="refresh"
            id="refreshBtn"
            type="button"
        >
            ↻ Refresh
        </button>

        <button
            class="auto-button"
            id="modeButton"
            type="button"
        >
            Automatic
        </button>

    </div>

</div>

<div
    class="winner"
    id="winner"
>
    <div class="winner-box">

        <div class="winner-icon">
            🏆
        </div>

        <h1>BINGO!</h1>

        <p id="winnerName">
            Winner
        </p>

        <p id="winnerCard">
            Cartela
        </p>

        <div class="countdown">
            Next round in
            <span id="winnerCount">5</span>s
        </div>

    </div>
</div>

<script>

const API =
    "https://zo-bingo.onrender.com";


if(
    window.Telegram &&
    Telegram.WebApp
){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}


/* =========================================================
   PLAYER ID
   ALWAYS USE TELEGRAM USER ID
========================================================= */

function getPlayerId(){

    const telegramUser =
        window.Telegram &&
        Telegram.WebApp &&
        Telegram.WebApp.initDataUnsafe &&
        Telegram.WebApp.initDataUnsafe.user;


    if(
        telegramUser &&
        telegramUser.id
    ){

        const id =
            "tg-" +
            String(
                telegramUser.id
            );

        localStorage.setItem(
            "zoBingoPlayerId",
            id
        );

        sessionStorage.setItem(
            "bingoPlayerId",
            id
        );

        return id;
    }


    const saved =
        localStorage.getItem(
            "zoBingoPlayerId"
        ) ||
        sessionStorage.getItem(
            "bingoPlayerId"
        );


    if(saved){
        return saved;
    }


    const id =
        "web-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2,8);


    localStorage.setItem(
        "zoBingoPlayerId",
        id
    );

    sessionStorage.setItem(
        "bingoPlayerId",
        id
    );

    return id;
}


const playerId =
    getPlayerId();


let gameRound = null;
let gameStatus = "picking";
let calledNumbers = [];
let myCards = [];
let myCardNumbers = [];
let automatic = true;
let manualMarks = {};
let loading = false;


/* =========================================================
   LOAD GAME
========================================================= */

async function loadGame(){

    if(loading){
        return;
    }

    loading = true;

    try{

        const response =
            await fetch(
                API +
                "/api/game-status?player_id=" +
                encodeURIComponent(
                    playerId
                ),
                {
                    cache:"no-store"
                }
            );

        const data =
            await response.json();


        if(!data.success){
            throw new Error(
                data.message ||
                "Server error"
            );
        }


        gameRound =
            data.round;

        gameStatus =
            data.status;

        calledNumbers =
            (
                data.called_numbers ||
                []
            ).map(Number);


        myCardNumbers =
            Array.isArray(
                data.my_card_numbers
            )
                ? data.my_card_numbers
                    .map(Number)
                    .filter(
                        n =>
                            n >= 1 &&
                            n <= 100
                    )
                : [];


        myCards =
            data.my_cards ||
            [];


        /*
         * Recover selected Cartelas from
         * the server reserved-card list if
         * game-status does not return them.
         */

        if(
            !myCardNumbers.length
        ){

            try{

                const cardsResponse =
                    await fetch(
                        API +
                        "/api/cards",
                        {
                            cache:"no-store"
                        }
                    );

                const cardsData =
                    await cardsResponse.json();


                const reserved =
                    cardsData.reserved_cards ||
                    {};

                const mine = [];


                Object.entries(
                    reserved
                ).forEach(
                    ([number,owner]) => {

                        if(
                            owner &&
                            String(
                                owner.player_id ||
                                owner.id ||
                                ""
                            ) ===
                            String(
                                playerId
                            )
                        ){

                            mine.push(
                                Number(number)
                            );

                        }

                    }
                );


                myCardNumbers =
                    [
                        ...new Set(
                            mine
                        )
                    ].slice(
                        0,
                        3
                    );


                if(
                    myCardNumbers.length
                ){

                    const allCards =
                        cardsData.cards ||
                        {};

                    myCards =
                        myCardNumbers
                            .map(
                                n =>
                                    allCards[n] ||
                                    allCards[
                                        String(n)
                                    ]
                            )
                            .filter(Boolean);

                }

            }catch(error){

                console.warn(
                    "Could not recover selected Cartelas",
                    error
                );

            }

        }


        document.getElementById(
            "gameId"
        ).textContent =
            "ZO-R" +
            data.round;


        renderStatus(
            data
        );


        renderBoard(
            calledNumbers
        );


        renderCard();


        if(
            data.winner
        ){

            showWinner(
                data.winner
            );

        }else{

            hideWinner();

        }

    }catch(error){

        console.error(error);

        document.getElementById(
            "statusBox"
        ).textContent =
            "Connection error";

    }finally{

        loading = false;

    }

}


/* =========================================================
   STATUS
========================================================= */

function renderStatus(data){

    const box =
        document.getElementById(
            "statusBox"
        );


    if(
        data.status ===
        "picking"
    ){

        box.textContent =
            "Waiting for players to join";

        return;

    }


    if(
        data.status ===
        "playing"
    ){

        box.textContent =
            data.players +
            " player" +
            (
                data.players === 1
                    ? ""
                    : "s"
            ) +
            " • Game Live";

        return;

    }


    if(
        data.status ===
        "winner"
    ){

        box.textContent =
            "BINGO!";

        return;

    }


    box.textContent =
        data.status;

}


/* =========================================================
   BOARD
========================================================= */

function renderBoard(numbers){

    const columns = {
        B:[],
        I:[],
        N:[],
        G:[],
        O:[]
    };


    numbers.forEach(
        number => {

            if(
                number >= 1 &&
                number <= 15
            ){
                columns.B.push(
                    number
                );
            }

            else if(
                number >= 16 &&
                number <= 30
            ){
                columns.I.push(
                    number
                );
            }

            else if(
                number >= 31 &&
                number <= 45
            ){
                columns.N.push(
                    number
                );
            }

            else if(
                number >= 46 &&
                number <= 60
            ){
                columns.G.push(
                    number
                );
            }

            else if(
                number >= 61 &&
                number <= 75
            ){
                columns.O.push(
                    number
                );
            }

        }
    );


    Object.entries(
        columns
    ).forEach(
        ([letter,values]) => {

            values
                .slice(
                    -5
                )
                .forEach(
                    (value,index) => {

                        const el =
                            document.getElementById(
                                letter.toLowerCase() +
                                (
                                    index +
                                    1
                                )
                            );

                        if(el){

                            el.textContent =
                                value;

                            el.classList.add(
                                "called"
                            );

                        }

                    }
                );

        }
    );


    const last =
        numbers.length
            ? numbers[
                numbers.length - 1
            ]
            : "-";


    document.getElementById(
        "bigBall"
    ).textContent =
        last;

}


/* =========================================================
   RENDER CARD
========================================================= */

function renderCard(){

    const area =
        document.getElementById(
            "cardArea"
        );


    if(
        !myCardNumbers.length
    ){

        area.innerHTML = `
            <div class="watch">
                👀<br>
                Watching Only<br>
                <small>No Cartela selected</small>
            </div>
        `;

        return;

    }


    const card =
        myCards[0];


    if(
        !card ||
        !Array.isArray(card)
    ){

        area.innerHTML = `
            <div class="watch">
                Loading your Cartela...
            </div>
        `;

        return;

    }


    let html =
        `<table class="bingo-card">
            <thead>
                <tr>
                    <th>B</th>
                    <th>I</th>
                    <th>N</th>
                    <th>G</th>
                    <th>O</th>
                </tr>
            </thead>
            <tbody>`;


    for(
        let row = 0;
        row < 5;
        row++
    ){

        html += "<tr>";


        for(
            let col = 0;
            col < 5;
            col++
        ){

            const index =
                row * 5 +
                col;

            const value =
                card[index];

            const isFree =
                value === "FREE";

            const isCalled =
                calledNumbers.includes(
                    Number(value)
                );

            const isManual =
                manualMarks[
                    index
                ] === true;


            const marked =
                isFree ||
                isCalled ||
                isManual;


            html +=
                `<td
                    class="${
                        marked
                            ? "marked"
                            : ""
                    } ${
                        isFree
                            ? "free"
                            : ""
                    }"
                    data-index="${index}"
                >
                    ${value}
                </td>`;

        }


        html += "</tr>";

    }


    html +=
        `</tbody></table>`;


    area.innerHTML =
        html;


    if(
        !automatic
    ){

        area
            .querySelectorAll(
                "td"
            )
            .forEach(
                cell => {

                    cell.addEventListener(
                        "click",
                        () => {

                            const index =
                                Number(
                                    cell.dataset.index
                                );

                            const value =
                                card[index];

                            if(
                                value ===
                                "FREE"
                            ){
                                return;
                            }

                            manualMarks[index] =
                                !manualMarks[index];

                            renderCard();

                        }
                    );

                }
            );

    }

}


/* =========================================================
   WINNER
========================================================= */

function showWinner(winner){

    const overlay =
        document.getElementById(
            "winner"
        );


    overlay.classList.add(
        "show"
    );


    document.getElementById(
        "winnerName"
    ).textContent =
        winner.name ||
        "Winner";


    document.getElementById(
        "winnerCard"
    ).textContent =
        "Cartela " +
        (
            winner.card_number ||
            ""
        );


    let seconds = 5;


    document.getElementById(
        "winnerCount"
    ).textContent =
        seconds;


    clearInterval(
        window.winnerTimer
    );


    window.winnerTimer =
        setInterval(
            () => {

                seconds--;

                document.getElementById(
                    "winnerCount"
                ).textContent =
                    Math.max(
                        seconds,
                        0
                    );

                if(
                    seconds <= 0
                ){

                    clearInterval(
                        window.winnerTimer
                    );

                }

            },
            1000
        );

}


function hideWinner(){

    document.getElementById(
        "winner"
    ).classList.remove(
        "show"
    );

}


/* =========================================================
   AUTOMATIC / MANUAL
========================================================= */

function updateModeUI(){

    const switchEl =
        document.getElementById(
            "autoSwitch"
        );

    const button =
        document.getElementById(
            "modeButton"
        );


    if(automatic){

        switchEl.classList.add(
            "on"
        );

        button.textContent =
            "Automatic";

    }else{

        switchEl.classList.remove(
            "on"
        );

        button.textContent =
            "Manual";

    }

    renderCard();

}


document.getElementById(
    "autoSwitch"
).addEventListener(
    "click",
    () => {

        automatic =
            !automatic;

        updateModeUI();

    }
);


document.getElementById(
    "modeButton"
).addEventListener(
    "click",
    () => {

        automatic =
            !automatic;

        updateModeUI();

    }
);


/* =========================================================
   REFRESH
========================================================= */

document.getElementById(
    "refreshBtn"
).addEventListener(
    "click",
    () => {

        loadGame();

    }
);


/* =========================================================
   LEAVE
========================================================= */

document.getElementById(
    "leaveBtn"
).addEventListener(
    "click",
    async () => {

        try{

            await fetch(
                API +
                "/api/leave",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({
                        player_id:
                            playerId
                    })
                }
            );

        }catch(error){

            console.error(error);

        }


        sessionStorage.removeItem(
            "bingoSelectedCards"
        );

        sessionStorage.removeItem(
            "bingoSelectedRound"
        );


        window.location.href =
            "cartela.html";

    }
);


/* =========================================================
   START
========================================================= */

loadGame();


setInterval(
    loadGame,
    1000
);

</script>

</body>
</html>
