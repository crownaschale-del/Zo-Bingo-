<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ZO BINGO - Live Game</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#080a16,#15102b);
    color:#fff;
}

.app{
    height:100%;
    width:100%;
    padding:7px;
    display:flex;
    flex-direction:column;
    gap:6px;
    overflow:hidden;
}

.top{
    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
    gap:5px;
    min-height:36px;
}

.brand{
    font-size:18px;
    font-weight:800;
}

.meta{
    text-align:center;
    font-size:11px;
    color:#aaa;
}

.back{
    justify-self:end;
    border:1px solid #40395d;
    background:#211b36;
    color:#fff;
    border-radius:8px;
    padding:6px 9px;
    font-size:11px;
}

.statusbar{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:5px;
}

.stat{
    background:#17142a;
    border:1px solid #30294c;
    border-radius:8px;
    text-align:center;
    padding:4px;
}

.stat small{
    display:block;
    color:#999;
    font-size:9px;
}

.stat b{
    font-size:13px;
}

.timer{
    color:#facc15;
}

.main{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:minmax(0,1.35fr) minmax(250px,.9fr);
    gap:6px;
}

.panel{
    min-height:0;
    background:rgba(20,17,36,.96);
    border:1px solid #30294c;
    border-radius:10px;
    padding:6px;
    overflow:hidden;
}

.left{
    display:flex;
    flex-direction:column;
    gap:5px;
}

.call-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.call-head h2{
    font-size:13px;
    margin:0;
}

.latest{
    font-size:20px;
    font-weight:900;
    color:#facc15;
}

.ball-board{
    display:grid;
    grid-template-columns:repeat(15,1fr);
    gap:2px;
    flex:0 0 auto;
}

.ball{
    font-size:8px;
    text-align:center;
    padding:3px 0;
    border-radius:4px;
    background:#27233b;
    color:#bbb;
}

.ball.called{
    background:#7c3aed;
    color:#fff;
    font-weight:800;
}

.ball.latest{
    background:#facc15;
    color:#111;
}

.modebar{
    display:flex;
    gap:4px;
    align-items:center;
}

.modebar span{
    font-size:9px;
    color:#aaa;
    margin-right:auto;
}

.mode{
    border:1px solid #40395d;
    background:#211c35;
    color:#ccc;
    border-radius:6px;
    padding:5px 7px;
    font-size:9px;
}

.mode.active{
    background:#7c3aed;
    color:#fff;
    border-color:#8b5cf6;
}

.mode:disabled{
    opacity:.5;
}

.cards{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(3,minmax(0,1fr));
    gap:5px;
}

.card-wrap{
    min-width:0;
    min-height:0;
    background:#121020;
    border:1px solid #332d50;
    border-radius:8px;
    padding:4px;
    display:flex;
    flex-direction:column;
}

.card-title{
    font-size:10px;
    font-weight:800;
    text-align:center;
    margin-bottom:3px;
}

.bingo-card{
    width:100%;
    height:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

.bingo-card th,
.bingo-card td{
    border:1px solid #39334f;
    text-align:center;
    padding:0;
    font-size:10px;
}

.bingo-card th{
    height:18px;
    background:#292342;
    color:#facc15;
}

.bingo-card td{
    height:0;
    background:#201c31;
    color:#eee;
}

.bingo-card td.marked{
    background:#16a34a;
    color:#fff;
    font-weight:900;
}

.bingo-card td.free{
    background:#eab308;
    color:#111;
    font-weight:900;
}

.right{
    display:grid;
    grid-template-rows:auto auto 1fr auto;
    gap:5px;
}

.box{
    background:#11101d;
    border:1px solid #30294c;
    border-radius:8px;
    padding:6px;
}

.box h3{
    margin:0 0 4px;
    font-size:11px;
}

.selected-info{
    font-size:10px;
    color:#bbb;
}

.watch{
    font-size:11px;
    color:#facc15;
    font-weight:800;
}

.bingo-btn{
    width:100%;
    border:0;
    border-radius:8px;
    background:#16a34a;
    color:#fff;
    padding:8px;
    font-weight:900;
    font-size:12px;
}

.bingo-btn:disabled{
    background:#3f4652;
    color:#aaa;
}

.message{
    min-height:16px;
    text-align:center;
    font-size:9px;
    color:#a7f3d0;
}

.winner{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(6,6,14,.92);
    z-index:10;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
}

.winner.show{
    display:flex;
}

.winner-box{
    width:min(340px,90%);
    background:#17132a;
    border:1px solid #7c3aed;
    border-radius:14px;
    padding:18px;
}

.trophy{
    font-size:40px;
}

.winner-box h1{
    margin:5px 0;
    font-size:25px;
    color:#facc15;
}

.winner-box p{
    margin:5px 0;
    font-size:13px;
}

.count{
    font-size:20px;
    font-weight:900;
    color:#facc15;
    margin-top:10px;
}

@media(max-width:700px){

    .app{
        padding:5px;
        gap:4px;
    }

    .brand{
        font-size:15px;
    }

    .statusbar{
        gap:3px;
    }

    .stat{
        padding:3px;
    }

    .stat b{
        font-size:11px;
    }

    .main{
        grid-template-columns:1fr 1fr;
        gap:4px;
    }

    .ball{
        font-size:7px;
        padding:2px 0;
    }

    .cards{
        grid-template-columns:1fr;
    }

    .cards .card-wrap:not(:first-child){
        display:none;
    }

    .bingo-card th,
    .bingo-card td{
        font-size:9px;
    }

    .right{
        grid-template-rows:auto auto 1fr auto;
    }

    .mode{
        padding:4px 5px;
        font-size:8px;
    }
}

@media(max-width:430px){

    .main{
        grid-template-columns:1fr 1.05fr;
    }

    .ball{
        font-size:6px;
    }

    .latest{
        font-size:17px;
    }

    .bingo-card th,
    .bingo-card td{
        font-size:8px;
    }

    .selected-info{
        font-size:9px;
    }
}
</style>
</head>

<body>

<div class="app" id="app">

    <div class="top">

        <div class="brand">
            🎱 ZO BINGO
        </div>

        <div class="meta">
            Round <b id="round">-</b>
            •
            <span id="status">Loading</span>
        </div>

        <button
            class="back"
            id="backBtn"
            type="button"
        >
            Exit
        </button>

    </div>


    <div class="statusbar">

        <div class="stat">
            <small>PLAYERS</small>
            <b id="players">0</b>
        </div>

        <div class="stat">
            <small>CALLED</small>
            <b id="calledCount">0</b>
        </div>

        <div class="stat">
            <small>NEXT</small>
            <b class="timer" id="nextTimer">-</b>
        </div>

        <div class="stat">
            <small>LAST</small>
            <b class="timer" id="lastNumber">-</b>
        </div>

    </div>


    <div class="main">

        <section class="panel left">

            <div class="call-head">

                <h2>
                    LIVE B • I • N • G • O
                </h2>

                <div
                    class="latest"
                    id="latest"
                >
                    -
                </div>

            </div>


            <div
                class="ball-board"
                id="ballBoard"
            ></div>


            <div
                class="modebar"
                id="modebar"
            >

                <span id="roleText">
                    Your mode
                </span>

                <button
                    class="mode active"
                    data-mode="automatic"
                    type="button"
                >
                    AUTO
                </button>

                <button
                    class="mode"
                    data-mode="manual"
                    type="button"
                >
                    MANUAL
                </button>

            </div>


            <div
                class="cards"
                id="cards"
            ></div>

        </section>


        <aside class="panel right">

            <div class="box">

                <h3>
                    YOUR CARTELAS
                </h3>

                <div
                    id="selectedInfo"
                    class="selected-info"
                >
                </div>

            </div>


            <div class="box">

                <h3>
                    GAME
                </h3>

                <div
                    id="gameInfo"
                    class="selected-info"
                >
                    Waiting for the first number…
                </div>

            </div>


            <div
                class="box"
                style="min-height:0"
            >

                <h3>
                    STATUS
                </h3>

                <div
                    id="message"
                    class="message"
                >
                    Connecting…
                </div>

                <div
                    id="watchText"
                    class="watch"
                >
                </div>

            </div>


            <button
                id="bingoBtn"
                class="bingo-btn"
                type="button"
            >
                🎯 BINGO
            </button>

        </aside>

    </div>


    <div
        class="winner"
        id="winnerOverlay"
    >

        <div class="winner-box">

            <div class="trophy">
                🏆
            </div>

            <h1>
                BINGO!
            </h1>

            <p id="winnerName">
                -
            </p>

            <p id="winnerCard">
                Cartela -
            </p>

            <div class="count">
                Next round in
                <span id="winnerCountdown">
                    5
                </span>s
            </div>

        </div>

    </div>

</div>


<script>

const API = "https://zo-bingo.onrender.com";


/* =========================================================
   TELEGRAM USER
========================================================= */

const tgUser =
    window.Telegram &&
    Telegram.WebApp &&
    Telegram.WebApp.initDataUnsafe &&
    Telegram.WebApp.initDataUnsafe.user;


/* =========================================================
   PLAYER ID
   IMPORTANT:
   Telegram ID is used so the same player is recognized
   after leaving and reopening Telegram.
========================================================= */

function getPlayerId(){

    const stored =
        localStorage.getItem(
            "zoBingoPlayerId"
        );

    if(
        tgUser &&
        tgUser.id
    ){

        const id =
            "tg-" +
            String(
                tgUser.id
            );

        localStorage.setItem(
            "zoBingoPlayerId",
            id
        );

        return id;
    }

    if(stored){
        return stored;
    }

    const id =
        "web-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2,9);

    localStorage.setItem(
        "zoBingoPlayerId",
        id
    );

    return id;
}


const playerId =
    getPlayerId();


const playerName =
    (
        tgUser &&
        (
            tgUser.first_name ||
            tgUser.username
        )
    ) ||
    localStorage.getItem(
        "zoBingoPlayerName"
    ) ||
    "Player";


/* =========================================================
   GAME VARIABLES
========================================================= */

let currentRound = null;

let currentStatus = "loading";

let calledNumbers = [];

let selectedCards = [];

let cards = {};

let mode = "automatic";

let isPlayer = false;

let winnerShown = false;

let lastWinnerId = null;

let manualMarks = {};


const $ =
    id =>
        document.getElementById(id);


/* =========================================================
   BINGO LETTER
========================================================= */

function bingoLetter(number){

    if(number <= 15){
        return "B";
    }

    if(number <= 30){
        return "I";
    }

    if(number <= 45){
        return "N";
    }

    if(number <= 60){
        return "G";
    }

    return "O";
}


/* =========================================================
   RENDER CALLED NUMBER BOARD
========================================================= */

function renderBoard(){

    let html = "";

    const last =
        calledNumbers[
            calledNumbers.length - 1
        ];

    for(
        let number = 1;
        number <= 75;
        number++
    ){

        const called =
            calledNumbers.includes(
                number
            );

        const letter =
            bingoLetter(number);

        html +=
            `<div class="ball
                ${called ? "called" : ""}
                ${number === last ? "latest" : ""}
            ">
                ${letter}${number}
            </div>`;
    }

    $("ballBoard").innerHTML =
        html;
}


/* =========================================================
   CHECK MARKED CELL
========================================================= */

function cellMarked(
    cardNumber,
    index,
    value
){

    if(
        value === "FREE" ||
        index === 12
    ){
        return true;
    }


    if(
        mode === "automatic"
    ){

        return calledNumbers.includes(
            Number(value)
        );
    }


    return !!manualMarks[
        cardNumber + ":" + index
    ];
}


/* =========================================================
   RENDER PLAYER CARDS
========================================================= */

function renderCards(){

    const root =
        $("cards");

    root.innerHTML = "";


    if(
        !selectedCards.length
    ){

        $("selectedInfo").textContent =
            "None — Watch-only";

        return;
    }


    $("selectedInfo").textContent =
        selectedCards
            .map(
                number =>
                    "#" + number
            )
            .join(" • ");


    selectedCards.forEach(
        number => {

            const card =
                cards[number];

            if(!card){
                return;
            }


            let html =

                `<div class="card-wrap">

                    <div class="card-title">
                        CARTELA ${number}
                    </div>

                    <table class="bingo-card">

                        <thead>

                            <tr>
                                <th>B</th>
                                <th>I</th>
                                <th>N</th>
                                <th>G</th>
                                <th>O</th>
                            </tr>

                        </thead>

                        <tbody>`;


            for(
                let index = 0;
                index < 25;
                index++
            ){

                if(
                    index % 5 === 0
                ){

                    html +=
                        "<tr>";
                }


                const value =
                    card[index];


                const marked =
                    cellMarked(
                        number,
                        index,
                        value
                    );


                const className =
                    value === "FREE"
                        ? "free"
                        : (
                            marked
                                ? "marked"
                                : ""
                        );


                html +=
                    `<td
                        class="${className}"
                        data-index="${index}"
                    >
                        ${
                            value === "FREE"
                                ? "FREE"
                                : value
                        }
                    </td>`;


                if(
                    index % 5 === 4
                ){

                    html +=
                        "</tr>";
                }
            }


            html +=
                `</tbody>
                    </table>
                </div>`;


            root.insertAdjacentHTML(
                "beforeend",
                html
            );
        }
    );


    /* =====================================================
       MANUAL MARKING
    ===================================================== */

    root
        .querySelectorAll("td")
        .forEach(
            td => {

                td.addEventListener(
                    "click",
                    () => {

                        if(
                            mode !== "manual"
                        ){
                            return;
                        }

                        if(
                            !isPlayer
                        ){
                            return;
                        }

                        if(
                            td.dataset.index === "12"
                        ){
                            return;
                        }


                        const index =
                            Number(
                                td.dataset.index
                            );


                        const wrap =
                            td.closest(
                                ".card-wrap"
                            );


                        const cardNumber =
                            Number(
                                wrap
                                    .querySelector(
                                        ".card-title"
                                    )
                                    .textContent
                                    .replace(
                                        /\D/g,
                                        ""
                                    )
                            );


                        const key =
                            cardNumber +
                            ":" +
                            index;


                        manualMarks[key] =
                            !manualMarks[key];


                        td.classList.toggle(
                            "marked",
                            !!manualMarks[key]
                        );

                    }
                );
            }
        );
}


/* =========================================================
   MESSAGE
========================================================= */

function setMsg(
    text,
    ok = true
){

    $("message").textContent =
        text;

    $("message").style.color =
        ok
            ? "#a7f3d0"
            : "#fca5a5";
}


/* =========================================================
   PLAYER / WATCHER DISPLAY
========================================================= */

function updateRole(){

    const watcher =
        !isPlayer;


    $("roleText").textContent =
        watcher
            ? "Watch-only"
            : "Your mode";


    $("watchText").textContent =
        watcher
            ? "👀 You are watching this game."
            : "";


    $("modebar").style.display =
        watcher
            ? "none"
            : "flex";


    $("bingoBtn").style.display =
        watcher
            ? "none"
            : "block";
}


/* =========================================================
   CHANGE AUTO / MANUAL MODE
========================================================= */

async function setMode(
    newMode
){

    if(!isPlayer){
        return;
    }


    try{

        const response =
            await fetch(
                API +
                "/api/set-mode",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            player_id:
                                playerId,

                            mode:
                                newMode
                        })
                }
            );


        const data =
            await response.json();


        if(!data.success){

            setMsg(
                data.message ||
                "Mode change failed",
                false
            );

            return;
        }


        mode =
            newMode;


        document
            .querySelectorAll(
                ".mode"
            )
            .forEach(
                button => {

                    button.classList.toggle(
                        "active",
                        button.dataset.mode ===
                        mode
                    );
                }
            );


        renderCards();


    }catch(error){

        setMsg(
            "Connection error",
            false
        );
    }
}


/* =========================================================
   WINNER
========================================================= */

function showWinner(
    winner,
    remaining
){

    if(!winner){
        return;
    }


    winnerShown =
        true;


    lastWinnerId =
        winner.id ||
        null;


    $("winnerName").textContent =
        winner.name ||
        "Winner";


    $("winnerCard").textContent =
        "Cartela " +
        (
            winner.card_number ||
            "-"
        );


    $("winnerCountdown").textContent =
        Math.max(
            0,
            Number(
                remaining ?? 5
            )
        );


    $("winnerOverlay")
        .classList
        .add("show");


    $("bingoBtn").disabled =
        true;


    document
        .querySelectorAll(
            ".mode"
        )
        .forEach(
            button => {
                button.disabled = true;
            }
        );
}


function hideWinner(){

    $("winnerOverlay")
        .classList
        .remove("show");

    winnerShown =
        false;

    lastWinnerId =
        null;
}


/* =========================================================
   RETURN TO CARTELA PAGE
========================================================= */

function goCartela(){

    window.location.href =
        "cartela.html";
}


/* =========================================================
   LOAD ALL CARTELA DATA
========================================================= */

async function loadCards(){

    try{

        const response =
            await fetch(
                API +
                "/api/cards",
                {
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Could not load Cartelas"
            );
        }


        cards =
            data.cards ||
            {};


        if(
            currentRound === null
        ){

            currentRound =
                data.round;
        }


        renderCards();


    }catch(error){

        setMsg(
            "Could not load Cartelas",
            false
        );

        console.error(error);
    }
}


/* =========================================================
   LOAD GAME STATUS
   IMPORTANT:
   player_id is sent to backend.
   This allows server to restore Cartelas after re-login.
========================================================= */

async function loadGame(){

    try{

        const response =
            await fetch(
                API +
                "/api/game-status?player_id=" +
                encodeURIComponent(
                    playerId
                ),
                {
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(!data.success){

            throw new Error(
                data.message ||
                "Could not load game"
            );
        }


        /* =================================================
           NEW ROUND
        ================================================= */

        if(
            currentRound !== null &&
            currentRound !== data.round
        ){

            currentRound =
                data.round;

            selectedCards =
                [];

            manualMarks =
                {};

            hideWinner();

            goCartela();

            return;
        }


        currentRound =
            data.round;


        currentStatus =
            data.status;


        calledNumbers =
            (
                data.called_numbers ||
                []
            )
            .map(Number);


        /* =================================================
           TOP INFORMATION
        ================================================= */

        $("round").textContent =
            data.round;


        $("status").textContent =
            String(
                data.status
            ).toUpperCase();


        $("players").textContent =
            data.players ?? 0;


        $("calledCount").textContent =
            calledNumbers.length;


        if(
            data.status === "winner"
        ){

            $("nextTimer").textContent =
                Math.max(
                    0,
                    Number(
                        data.remaining || 0
                    )
                ) +
                "s";

        }else if(
            data.status === "playing"
        ){

            $("nextTimer").textContent =
                "LIVE";

        }else if(
            data.status === "picking"
        ){

            $("nextTimer").textContent =
                Math.max(
                    0,
                    Number(
                        data.remaining || 0
                    )
                ) +
                "s";

        }else{

            $("nextTimer").textContent =
                "-";
        }


        if(
            calledNumbers.length
        ){

            const last =
                calledNumbers[
                    calledNumbers.length - 1
                ];


            $("lastNumber").textContent =
                bingoLetter(last) +
                "-" +
                last;


            $("latest").textContent =
                bingoLetter(last) +
                "-" +
                last;

        }else{

            $("lastNumber").textContent =
                "-";

            $("latest").textContent =
                "-";
        }


        /* =================================================
           GAME INFORMATION
        ================================================= */

        if(
            data.status === "playing"
        ){

            $("gameInfo").textContent =
                "Numbers are being called every 3 seconds.";

        }else if(
            data.status === "winner"
        ){

            $("gameInfo").textContent =
                "Winner confirmed.";

        }else if(
            data.status === "picking"
        ){

            $("gameInfo").textContent =
                "Waiting for players…";

        }else{

            $("gameInfo").textContent =
                "Waiting…";
        }


        renderBoard();


        /* =================================================
           RESTORE CARTELAS FROM SERVER
        ================================================= */

        const serverCards =
            Array.isArray(
                data.my_card_numbers
            )
                ? data.my_card_numbers
                    .map(Number)
                    .filter(
                        number =>
                            number >= 1 &&
                            number <= 100
                    )
                : [];


        /*
         * This is the important fix.
         *
         * We do NOT depend on sessionStorage here.
         * The server tells us which Cartelas
         * belong to this Telegram player.
         */

        isPlayer =
            serverCards.length > 0;


        if(isPlayer){

            selectedCards =
                serverCards.slice(
                    0,
                    3
                );


            mode =
                data.my_mode === "manual"
                    ? "manual"
                    : "automatic";


            document
                .querySelectorAll(
                    ".mode"
                )
                .forEach(
                    button => {

                        button.classList.toggle(
                            "active",
                            button.dataset.mode ===
                            mode
                        );
                    }
                );

        }else{

            selectedCards =
                [];

            mode =
                "automatic";
        }


        updateRole();

        renderCards();


        /* =================================================
           WINNER
        ================================================= */

        if(
            currentStatus === "winner" &&
            data.winner
        ){

            showWinner(
                data.winner,
                data.remaining
            );

        }else if(
            currentStatus !== "winner" &&
            winnerShown
        ){

            goCartela();

            return;
        }


        /* =================================================
           PICKING STATUS
        ================================================= */

        if(
            currentStatus === "picking"
        ){

            if(isPlayer){

                $("gameInfo").textContent =
                    "Selection period is active.";

            }else{

                $("gameInfo").textContent =
                    "Waiting for the first player to select a Cartela…";
            }
        }


        /* =================================================
           MESSAGE
        ================================================= */

        if(isPlayer){

            setMsg(
                "Your Cartelas are connected.",
                true
            );

        }else{

            setMsg(
                "Watching live.",
                true
            );
        }


    }catch(error){

        setMsg(
            "Server connection error",
            false
        );

        console.error(error);
    }
}


/* =========================================================
   CLAIM BINGO
========================================================= */

async function claimBingo(){

    if(
        !isPlayer ||
        currentStatus !== "playing"
    ){
        return;
    }


    setMsg(
        "Checking BINGO…"
    );


    for(
        const cardNumber of selectedCards
    ){

        try{

            const response =
                await fetch(
                    API +
                    "/api/bingo",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({

                                player_id:
                                    playerId,

                                card_number:
                                    cardNumber

                            })
                    }
                );


            const data =
                await response.json();


            if(
                data.success &&
                data.winner
            ){

                showWinner(
                    data.winner,
                    5
                );


                setMsg(
                    "🏆 Valid BINGO!"
                );


                return;
            }


        }catch(error){

            setMsg(
                "Connection error",
                false
            );

            return;
        }
    }


    setMsg(
        "Not BINGO yet.",
        false
    );
}


/* =========================================================
   BUTTONS
========================================================= */

$("bingoBtn")
    .addEventListener(
        "click",
        claimBingo
    );


document
    .querySelectorAll(".mode")
    .forEach(
        button => {

            button.addEventListener(
                "click",
                () => {

                    setMode(
                        button.dataset.mode
                    );
                }
            );
        }
    );


$("backBtn")
    .addEventListener(
        "click",
        () => {

            /*
             * IMPORTANT:
             * Going back does NOT remove
             * the player's Cartelas.
             */
            goCartela();
        }
    );


/* =========================================================
   START
========================================================= */

loadGame();

loadCards();


/*
 * Refresh live game information
 * every second.
 */

setInterval(
    loadGame,
    1000
);


/*
 * Refresh Cartela data
 * every 1.5 seconds.
 */

setInterval(
    loadCards,
    1500
);

</script>
