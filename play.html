<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">

<title>ZO BINGO</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial,Helvetica,sans-serif;
    background:#080d22;
    color:white;
}

body{
    -webkit-user-select:none;
    user-select:none;
}

.app{
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* ================= TOP ================= */

.top{
    height:48px;
    flex:none;
    background:#1b2735;
    display:flex;
    align-items:center;
    padding:0 12px;
}

.brand{
    font-size:20px;
    font-weight:800;
}

/* ================= GAME INFO ================= */

.info{
    flex:none;
    display:grid;
    grid-template-columns:1fr 1fr 1fr 1fr 1fr;
    gap:5px;
    padding:5px 8px;
    background:#111936;
}

.info-box{
    min-width:0;
    background:#292450;
    border:1px solid #5d527d;
    border-radius:5px;
    padding:3px 7px;
}

.info-box span{
    display:block;
    color:#ddd;
    font-size:10px;
    font-weight:600;
}

.info-box strong{
    display:block;
    font-size:15px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

/* ================= MAIN ================= */

.main{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:44% 56%;
    gap:5px;
    padding:4px 8px;
    overflow:hidden;
}

/* ================= LEFT NUMBER BOARD ================= */

.number-panel{
    min-width:0;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
}

.number-column{
    min-width:0;
    min-height:0;
    display:grid;
    grid-template-rows:34px repeat(15,1fr);
    gap:4px;
}

.letter{
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:900;
    color:white;
}

.letter.b{background:#287be8;}
.letter.i{background:#6055ef;}
.letter.n{background:#a943e5;}
.letter.g{background:#08bd55;}
.letter.o{background:#ff7900;}

.number{
    min-height:0;
    border-radius:5px;
    background:#65617a;
    border:1px solid #8b849b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:600;
    color:#fff;
}

.number.called{
    background:#08bd55;
    border-color:#08bd55;
    font-weight:900;
}

.number.last{
    background:#ff7900;
    border-color:#ff9b3d;
    font-weight:900;
}

/* ================= RIGHT ================= */

.right{
    min-width:0;
    min-height:0;
    display:flex;
    flex-direction:column;
    gap:5px;
    overflow:hidden;
}

.called-strip{
    height:48px;
    flex:none;
    background:#303348;
    border:1px solid #5b5d73;
    border-radius:5px;
    display:flex;
    align-items:center;
    gap:5px;
    padding:5px;
}

.called-ball{
    width:40px;
    height:40px;
    border-radius:50%;
    background:#fb8500;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11px;
    font-weight:900;
    flex:none;
}

.called-empty{
    color:#aaa;
    font-size:12px;
}

.sound{
    margin-left:auto;
    font-size:22px;
}

/* ================= BIG CURRENT BALL ================= */

.big-ball-area{
    height:140px;
    flex:none;
    border-radius:5px;
    background:linear-gradient(135deg,#685f68,#27263c);
    border:1px solid #69616c;
    display:flex;
    align-items:center;
    justify-content:center;
}

.big-ball{
    width:92px;
    height:92px;
    border-radius:50%;
    background:white;
    border:8px solid #ffd000;
    color:#6315a9;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:25px;
    font-weight:900;
    box-shadow:0 0 0 7px rgba(255,208,0,.12);
}

/* ================= MODE ================= */

.mode-row{
    height:45px;
    flex:none;
    border-radius:25px;
    background:#343850;
    border:1px solid #5a5d72;
    display:flex;
    align-items:center;
    padding:5px 8px 5px 14px;
    font-size:13px;
}

.switch{
    margin-left:auto;
    width:50px;
    height:30px;
    border-radius:20px;
    background:#667085;
    padding:3px;
    cursor:pointer;
}

.switch-dot{
    width:24px;
    height:24px;
    border-radius:50%;
    background:white;
    transition:.15s;
}

.switch.on{
    background:#00c853;
}

.switch.on .switch-dot{
    margin-left:20px;
}

/* ================= CARD ================= */

.card-area{
    flex:1;
    min-height:0;
    border:1px solid #656477;
    border-radius:5px;
    background:linear-gradient(135deg,#34365b,#20265d);
    padding:5px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.card-title{
    height:32px;
    flex:none;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:5px;
}

.card-letter{
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:14px;
    font-weight:900;
}

.card-letter.b{background:#287be8;}
.card-letter.i{background:#6055ef;}
.card-letter.n{background:#a943e5;}
.card-letter.g{background:#08bd55;}
.card-letter.o{background:#ff7900;}

.card-grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:5px;
    margin-top:5px;
}

.card-cell{
    min-width:0;
    min-height:0;
    border-radius:4px;
    background:#f2f2f5;
    color:#4b1c8b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:800;
}

.card-cell.marked{
    background:#08bd55;
    color:white;
}

.card-cell.free{
    background:#08bd55;
    color:#fff200;
    font-size:20px;
}

.card-number{
    flex:none;
    margin:5px auto 0;
    background:#6a5738;
    border:1px solid #b99346;
    border-radius:18px;
    padding:3px 18px;
    color:#ffe36e;
    font-size:11px;
    font-weight:800;
}
/* ================= MULTIPLE CARTELAS ================= */

.multi-card-list{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-rows:repeat(3,minmax(0,1fr));
    gap:3px;
    overflow:hidden;
}

.mini-card{
    min-height:0;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.mini-card-title{
    flex:none;
    height:18px;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:2px;
}

.mini-card-title .card-letter{
    font-size:9px;
    border-radius:2px;
}

.mini-card-grid{
    flex:1;
    min-height:0;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    grid-template-rows:repeat(5,1fr);
    gap:2px;
    margin-top:2px;
}

.mini-card-grid .card-cell{
    min-width:0;
    min-height:0;
    border-radius:2px;
    font-size:8px;
}

.mini-card-grid .card-cell.free{
    font-size:11px;
}

.mini-card-number{
    flex:none;
    height:14px;
    line-height:14px;
    text-align:center;
    color:#ffe36e;
    font-size:8px;
    font-weight:800;
}
/* ================= WATCH ONLY ================= */

.watch{
    flex:1;
    min-height:0;
    border:1px solid #656477;
    border-radius:5px;
    background:#151a36;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:15px;
}

.watch-title{
    font-size:20px;
    font-weight:900;
    margin-bottom:8px;
}

.watch-text{
    color:#aaa;
    font-size:13px;
}

/* ================= BOTTOM ================= */

.bottom{
    flex:none;
    height:62px;
    display:grid;
    grid-template-columns:1fr 1fr 2.2fr;
    gap:10px;
    padding:6px 8px 8px;
    background:#111936;
}

.bottom button{
    border:0;
    border-radius:9px;
    font-size:15px;
    font-weight:900;
    color:white;
}

.leave{
    background:linear-gradient(90deg,#ff5757,#ff6500);
}

.refresh{
    background:linear-gradient(90deg,#ff5757,#ff6500);
}

.auto-button{
    background:#b18b22;
    color:#eee !important;
}

.auto-button.manual{
    background:#6354a5;
}

/* ================= WINNER ================= */

.winner{
    display:none;
    position:absolute;
    inset:0;
    z-index:50;
    background:rgba(5,8,20,.96);
    align-items:center;
    justify-content:center;
    text-align:center;
}

.winner.show{
    display:flex;
}

.winner-box{
    width:85%;
    max-width:350px;
    padding:25px;
    border-radius:15px;
    background:#211943;
    border:2px solid #ffd000;
}

.winner-icon{
    font-size:50px;
}

.winner-box h1{
    color:#ffd000;
    margin:8px 0;
    font-size:30px;
}

.winner-box p{
    margin:6px;
}

.countdown{
    color:#ffd000;
    font-size:20px;
    font-weight:900;
}
/* ================= WINNING CARTELA ================= */

.winner-name{
    margin:5px 0;
    font-size:20px;
    font-weight:900;
    color:white;
}

.winner-card-number{
    margin:4px 0 7px;
    color:#ffe36e;
    font-size:13px;
    font-weight:900;
}

.winner-cartela{
    width:100%;
    max-width:270px;
    margin:6px auto;
    padding:4px;
    background:#34365b;
    border:1px solid #656477;
    border-radius:7px;
}

.winner-cartela-title{
    color:#ffe36e;
    font-size:10px;
    font-weight:900;
    margin-bottom:4px;
}

.winner-cartela-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:3px;
}

.winner-cartela-letter{
    height:20px;
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:900;
    color:white;
}

.winner-cartela-letter.b{
    background:#287be8;
}

.winner-cartela-letter.i{
    background:#6055ef;
}

.winner-cartela-letter.n{
    background:#a943e5;
}

.winner-cartela-letter.g{
    background:#08bd55;
}

.winner-cartela-letter.o{
    background:#ff7900;
}

.winner-cartela-cell{
    aspect-ratio:1;
    min-width:0;
    border-radius:3px;
    background:#f2f2f5;
    color:#4b1c8b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:9px;
    font-weight:900;
}

.winner-cartela-cell.called{
    background:#08bd55;
    color:white;
}

.winner-cartela-cell.free{
    background:#08bd55;
    color:#fff200;
    font-size:13px;
}

.winner-called-title{
    color:#aaa;
    font-size:9px;
    margin:5px 0;
}
/* ================= RESPONSIVE ================= */

@media(max-width:600px){

    .brand{
        font-size:17px;
    }

    .info{
        gap:3px;
        padding:4px;
    }

    .info-box{
        padding:3px 4px;
    }

    .info-box span{
        font-size:8px;
    }

    .info-box strong{
        font-size:11px;
    }

    .main{
        grid-template-columns:42% 58%;
        padding:3px 4px;
    }

    .number-panel{
        gap:3px;
    }

    .number-column{
        grid-template-rows:30px repeat(15,1fr);
        gap:3px;
    }

    .letter{
        font-size:11px;
    }

    .number{
        font-size:10px;
    }

    .called-strip{
        height:40px;
    }

    .called-ball{
        width:32px;
        height:32px;
        font-size:9px;
    }

    .big-ball-area{
        height:105px;
    }

    .big-ball{
        width:72px;
        height:72px;
        border-width:6px;
        font-size:20px;
    }

    .mode-row{
        height:38px;
        font-size:11px;
    }

    .switch{
        width:44px;
        height:26px;
    }

    .switch-dot{
        width:20px;
        height:20px;
    }

    .switch.on .switch-dot{
        margin-left:18px;
    }

    .card-title{
        height:25px;
        gap:3px;
    }

    .card-letter{
        font-size:10px;
    }

    .card-grid{
        gap:3px;
        margin-top:3px;
    }

    .card-cell{
        font-size:9px;
    }

    .card-cell.free{
        font-size:14px;
    }

    .card-number{
        font-size:8px;
        padding:2px 10px;
        margin-top:3px;
    }

    .bottom{
        height:52px;
        gap:5px;
        padding:4px;
    }

    .bottom button{
        font-size:11px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- TOP -->
    <div class="top">
        <div class="brand">🎱 ZO BINGO</div>
    </div>

    <!-- GAME INFORMATION -->
    <div class="info">

        <div class="info-box">
            <span>GAME ID</span>
            <strong id="gameId">ZO-R1</strong>
        </div>

        <div class="info-box">
            <span>PLAYERS</span>
            <strong id="players">0</strong>
        </div>

        <div class="info-box">
            <span>BET</span>
            <strong id="bet">10</strong>
        </div>

        <div class="info-box">
            <span>DERASH</span>
            <strong id="derash">0</strong>
        </div>

        <div class="info-box">
            <span>CALLED</span>
            <strong id="calledCount">0</strong>
        </div>

    </div>

    <!-- MAIN -->
    <div class="main">

        <!-- LEFT -->
        <div
            class="number-panel"
            id="numberPanel"
        ></div>

        <!-- RIGHT -->
        <div class="right">

            <!-- LAST CALLED -->
            <div
                class="called-strip"
                id="calledStrip"
            >
                <span class="called-empty">
                    Waiting for numbers...
                </span>

                <span class="sound">
                    🔊
                </span>
            </div>

            <!-- BIG NUMBER -->
            <div class="big-ball-area">

                <div
                    class="big-ball"
                    id="bigBall"
                >
                    -
                </div>

            </div>

            <!-- AUTOMATIC -->
            <div
                class="mode-row"
                id="modeRow"
            >

                <span>
                    Automatic
                </span>

                <div
                    class="switch on"
                    id="autoSwitch"
                    role="button"
                    aria-label="Automatic mode"
                >
                    <div class="switch-dot"></div>
                </div>

            </div>

            <!-- CARD / WATCH -->
            <div
                id="cardArea"
                class="card-area"
            ></div>

        </div>

    </div>

    <!-- BOTTOM -->
    <div class="bottom">

        <button
            class="leave"
            id="leaveBtn"
            type="button"
        >
            Leave
        </button>

        <button
            class="refresh"
            id="refreshBtn"
            type="button"
        >
            ↻ Refresh
        </button>

        <button
            class="auto-button"
            id="modeButton"
            type="button"
        >
            Automatic
        </button>

    </div>

</div>


<!-- WINNER -->
<div
    class="winner"
    id="winner"
>

    <div class="winner-box">

        <div class="winner-icon">
            🏆
        </div>

        <h1>
            BINGO!
        </h1>

        <p id="winnerName">
            Winner
        </p>

        <p id="winnerCard">
            Cartela
        </p>

    <div id="winnerCartela"></div>
          
          <div class="countdown">
            Next round in
            <span id="winnerCount">
                5
            </span>s
        </div>

    </div>

</div>


<script>

/* =========================================================
   CONFIG
========================================================= */

const API =
    "https://zo-bingo.onrender.com";


/* =========================================================
   TELEGRAM
========================================================= */

if(
    window.Telegram &&
    Telegram.WebApp
){
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
}


/* =========================================================
   PLAYER ID
   Use the same identity as Cartela page when available.
========================================================= */

function getPlayerId(){

    const telegramUser =
        window.Telegram &&
        Telegram.WebApp &&
        Telegram.WebApp.initDataUnsafe &&
        Telegram.WebApp.initDataUnsafe.user;


    /* PRIMARY ID: always use the Telegram user ID */
    if(
        telegramUser &&
        telegramUser.id
    ){

        const id =
            "tg-" +
            String(
                telegramUser.id
            );

        localStorage.setItem(
            "zoBingoPlayerId",
            id
        );

        sessionStorage.setItem(
            "bingoPlayerId",
            id
        );

        return id;
    }


    /* FALLBACK: saved ID */

    const saved =
        localStorage.getItem(
            "zoBingoPlayerId"
        );

    if(saved){
        return saved;
    }


    const id =
        "web-" +
        Date.now() +
        "-" +
        Math.random()
            .toString(36)
            .slice(2,8);


    localStorage.setItem(
        "zoBingoPlayerId",
        id
    );


    return id;
}


const playerId =
    getPlayerId();


/* =========================================================
   STATE
========================================================= */

let gameRound = null;

let gameStatus = "picking";

let calledNumbers = [];

let myCards = [];

let myCardNumbers = [];

let allCards = {};

let automatic = true;

let winnerVisible = false;


/* =========================================================
   BINGO LETTER
========================================================= */

function letter(number){

    number =
        Number(number);

    if(number <= 15)
        return "B";

    if(number <= 30)
        return "I";

    if(number <= 45)
        return "N";

    if(number <= 60)
        return "G";

    return "O";
}


/* =========================================================
   LEFT BOARD
========================================================= */

function renderNumberBoard(){

    const panel =
        document.getElementById(
            "numberPanel"
        );


    const columns = [
        {
            name:"B",
            cls:"b",
            start:1
        },
        {
            name:"I",
            cls:"i",
            start:16
        },
        {
            name:"N",
            cls:"n",
            start:31
        },
        {
            name:"G",
            cls:"g",
            start:46
        },
        {
            name:"O",
            cls:"o",
            start:61
        }
    ];


    panel.innerHTML = "";


    columns.forEach(
        column => {

            const col =
                document.createElement(
                    "div"
                );


            col.className =
                "number-column";


            const head =
                document.createElement(
                    "div"
                );


            head.className =
                "letter " +
                column.cls;


            head.textContent =
                column.name;


            col.appendChild(
                head
            );


            for(
                let i = 0;
                i < 15;
                i++
            ){

                const number =
                    column.start + i;


                const cell =
                    document.createElement(
                        "div"
                    );


                cell.className =
                    "number";


                cell.textContent =
                    number;


                if(
                    calledNumbers.includes(
                        number
                    )
                ){

                    cell.classList.add(
                        "called"
                    );
                }


                if(
                    calledNumbers.length &&
                    number ===
                    calledNumbers[
                        calledNumbers.length - 1
                    ]
                ){

                    cell.classList.remove(
                        "called"
                    );

                    cell.classList.add(
                        "last"
                    );
                }


                col.appendChild(
                    cell
                );
            }


            panel.appendChild(
                col
            );
        }
    );
}


/* =========================================================
   LAST CALLED BALLS
========================================================= */

function renderCalledStrip(){

    const strip =
        document.getElementById(
            "calledStrip"
        );


    const latest =
        calledNumbers
            .slice(-2);


    strip.innerHTML = "";


    if(!latest.length){

        const empty =
            document.createElement(
                "span"
            );

        empty.className =
            "called-empty";

        empty.textContent =
            "Waiting for numbers...";

        strip.appendChild(
            empty
        );

    }else{

        latest.forEach(
            number => {

                const ball =
                    document.createElement(
                        "div"
                    );

                ball.className =
                    "called-ball";

                ball.textContent =
                    letter(number) +
                    "-" +
                    number;

                strip.appendChild(
                    ball
                );
            }
        );
    }


    const sound =
        document.createElement(
            "span"
        );

    sound.className =
        "sound";

    sound.textContent =
        "🔊";

    strip.appendChild(
        sound
    );
}


/* =========================================================
   BIG NUMBER
========================================================= */

function renderBigBall(){

    const ball =
        document.getElementById(
            "bigBall"
        );


    if(!calledNumbers.length){

        ball.textContent =
            "-";

        return;
    }


    const number =
        calledNumbers[
            calledNumbers.length - 1
        ];


    ball.textContent =
        letter(number) +
        "-" +
        number;
}

/* =========================================================
   CARD
========================================================= */

function renderCard(){

    const area =
        document.getElementById(
            "cardArea"
        );

    area.innerHTML = "";


    /* =================================================
       WATCH ONLY
    ================================================= */

    if(
        !myCardNumbers.length
    ){

        area.innerHTML = `

            <div class="watch">

                <div>

                    <div class="watch-title">
                        👀 Watching Only
                    </div>

                    <div class="watch-text">
                        You did not select a Cartela.
                        <br>
                        You can watch the live game.
                    </div>

                </div>

            </div>

        `;

        return;
    }


    /* =================================================
       SELECT UP TO 3 CARTELAS
    ================================================= */

    const selectedNumbers =
        myCardNumbers
            .slice(0,3)
            .map(Number);


    /* =================================================
       CHECK CARTELA DATA
    ================================================= */

    let cardsReady = true;


    selectedNumbers.forEach(
        number => {

            if(
                !allCards[number] &&
                !allCards[String(number)]
            ){

                cardsReady = false;

            }

        }
    );


    if(!cardsReady){

        area.innerHTML = `

            <div class="watch">

                <div>

                    <div class="watch-title">
                        🎱 Loading Cartelas...
                    </div>

                    <div class="watch-text">
                        Please wait...
                    </div>

                </div>

            </div>

        `;

        return;
    }


    /* =================================================
       MULTIPLE CARTELAS
    ================================================= */

    const list =
        document.createElement(
            "div"
        );

    list.className =
        "multi-card-list";


    selectedNumbers.forEach(
        cardNumber => {

            const card =
                allCards[cardNumber] ||
                allCards[String(cardNumber)];


            if(!card){
                return;
            }


            const mini =
                document.createElement(
                    "div"
                );

            mini.className =
                "mini-card";


            /* =========================================
               B I N G O HEADER
            ========================================= */

            const title =
                document.createElement(
                    "div"
                );

            title.className =
                "mini-card-title";


            [
                "B",
                "I",
                "N",
                "G",
                "O"
            ].forEach(
                (letter,i) => {

                    const x =
                        document.createElement(
                            "div"
                        );

                    x.className =
                        "card-letter " +
                        [
                            "b",
                            "i",
                            "n",
                            "g",
                            "o"
                        ][i];

                    x.textContent =
                        letter;

                    title.appendChild(
                        x
                    );

                }
            );


            mini.appendChild(
                title
            );


            /* =========================================
               5 × 5 CARTELA GRID
            ========================================= */

            const grid =
                document.createElement(
                    "div"
                );

            grid.className =
                "mini-card-grid";


            for(
                let i = 0;
                i < 25;
                i++
            ){

                const cell =
                    document.createElement(
                        "div"
                    );

                cell.className =
                    "card-cell";


                const value =
                    card[i];


                /* FREE CENTER */

                if(
                    value === "FREE" ||
                    i === 12
                ){

                    cell.classList.add(
                        "free"
                    );

                    cell.textContent =
                        "✦";

                }else{

                    cell.textContent =
                        value;


                    /* AUTOMATIC MODE */

                    if(
                        automatic &&
                        calledNumbers.includes(
                            Number(value)
                        )
                    ){

                        cell.classList.add(
                            "marked"
                        );

                    }


                    /* MANUAL MODE */

                    if(!automatic){

                        cell.addEventListener(
                            "click",
                            () => {

                                cell.classList.toggle(
                                    "marked"
                                );

                            }
                        );

                    }

                }


                grid.appendChild(
                    cell
                );

            }


            mini.appendChild(
                grid
            );


            /* =========================================
               CARTELA NUMBER
            ========================================= */

            const label =
                document.createElement(
                    "div"
                );

            label.className =
                "mini-card-number";

            label.textContent =
                "Cartela No: " +
                cardNumber;


            mini.appendChild(
                label
            );


            list.appendChild(
                mini
            );

        }
    );


    area.appendChild(
        list
    );
}

/* =========================================================
   LOAD CARDS
========================================================= */

async function loadCards(){

    try{

        const response =
            await fetch(
                API +
                "/api/cards",
                {
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(
            !data.success
        ){

            return;
        }


        allCards =
            data.cards ||
            {};


        renderCard();

    }catch(error){

        console.log(
            "Cards error:",
            error
        );
    }
}


/* =========================================================
   LOAD GAME
========================================================= */

async function loadGame(){

    try{

        const response =
            await fetch(
                API +
                "/api/game-status?player_id=" +
                encodeURIComponent(
                    playerId
                ),
                {
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(
            !data.success
        ){
            return;
        }


        /* Round */
        if(
            gameRound !== null &&
            gameRound !== data.round
        ){

            /*
             * New round.
             * Return to Cartela page.
             */
            window.location.href =
                "cartela.html";

            return;
        }


        gameRound =
            data.round;


        gameStatus =
            data.status;


        calledNumbers =
            (
                data.called_numbers ||
                []
            ).map(Number);


        myCardNumbers =
            Array.isArray(
                data.my_card_numbers
            )
                ? data.my_card_numbers
                    .map(Number)
                    .filter(
                        n =>
                            n >= 1 &&
                            n <= 100
                    )
                : [];


        myCards =
            data.my_cards ||
            [];


        /* Recover selected Cartelas from the server */
        if(!myCardNumbers.length){
            try{
                const cardsResponse = await fetch(
                    API + "/api/cards",
                    { cache: "no-store" }
                );

                const cardsData =
                    await cardsResponse.json();

                const reserved =
                    cardsData.reserved_cards || {};

                const mine = [];

                Object.entries(reserved).forEach(
                    ([number, owner]) => {
                        if(
                            owner &&
                            String(owner.player_id || owner.id || "") ===
                            String(playerId)
                        ){
                            mine.push(Number(number));
                        }
                    }
                );

                myCardNumbers =
                    [...new Set(mine)]
                        .slice(0, 3);

                if(myCardNumbers.length){
                    const cards =
                        cardsData.cards || {};

                    myCards =
                        myCardNumbers
                            .map(n =>
                                cards[n] ||
                                cards[String(n)]
                            )
                            .filter(Boolean);
                }
            }catch(error){
                console.warn(
                    "Could not recover selected Cartelas",
                    error
                );
            }
        }


        /* ================= INFO ================= */

        document.getElementById(
            "gameId"
        ).textContent =
            "ZO-R" +
            data.round;


        document.getElementById(
            "players"
        ).textContent =
            data.players ||
            0;


        const stake =
            Number(
                sessionStorage.getItem(
                    "selectedStake"
                ) ||
                10
            );


        document.getElementById(
            "bet"
        ).textContent =
            stake;


        /*
         * Current backend does not yet provide
         * total Derash, so for now use:
         * players × stake.
         */
        document.getElementById(
            "derash"
        ).textContent =
            (
                Number(data.players || 0) *
                stake
            ).toLocaleString();


        document.getElementById(
            "calledCount"
        ).textContent =
            calledNumbers.length;


        /* ================= BOARD ================= */

        renderNumberBoard();

        renderCalledStrip();

        renderBigBall();

        renderCard();


        /* ================= WINNER ================= */

        if(
            data.status === "winner" &&
            data.winner
        ){

            showWinner(
                data.winner,
                data.remaining
            );

        }else if(
            data.status !== "winner" &&
            winnerVisible
        ){

            winnerVisible =
                false;

            document
                .getElementById(
                    "winner"
                )
                .classList
                .remove(
                    "show"
                );
        }


    }catch(error){

        console.log(
            "Game error:",
            error
        );
    }
}
/* =========================================================
   WINNER
========================================================= */
function showWinner(
    winner,
    remaining
){

    if(!winner){
        return;
    }


    winnerVisible = true;


    /* =================================================
       WINNER NAME
    ================================================= */

    const winnerName =
        winner.name ||
        winner.username ||
        winner.first_name ||
        "Player";


    /* =================================================
       PRIZE / DERASH
    ================================================= */

    const derashElement =
        document.getElementById(
            "derash"
        );


    let derashAmount =
        derashElement
            ? derashElement.textContent.trim()
            : "0";


    derashAmount =
        derashAmount
            .replace(
                /birr/gi,
                ""
            )
            .trim();


    /* =================================================
       CHECK IF CURRENT PLAYER IS THE WINNER
    ================================================= */

    const winnerPlayerId =
        String(
            winner.player_id ||
            winner.id ||
            ""
        ).trim();


    const currentPlayerId =
        String(
            playerId ||
            ""
        ).trim();


    const isMe =
        winnerPlayerId !== "" &&
        currentPlayerId !== "" &&
        winnerPlayerId === currentPlayerId;


    /* =================================================
       WINNER MESSAGE
    ================================================= */

    if(isMe){

        document.getElementById(
            "winnerName"
        ).textContent =
            "Congratulations, " +
            winnerName +
            "! You won " +
            derashAmount +
            " Birr";

    }else{

        document.getElementById(
            "winnerName"
        ).textContent =
            winnerName +
            " won " +
            derashAmount +
            " Birr";
    }


    /* =================================================
       WINNING CARTELA NUMBER
    ================================================= */

    const cardNumber =
        Number(
            winner.card_number ||
            0
        );


    document.getElementById(
        "winnerCard"
    ).textContent =
        "Cartela No: " +
        (
            cardNumber ||
            "-"
        );


    /* =================================================
       WINNING CARTELA
    ================================================= */

    renderWinnerCartela(
        cardNumber
    );


    /* =================================================
       COUNTDOWN
    ================================================= */

    document.getElementById(
        "winnerCount"
    ).textContent =
        Math.max(
            0,
            Number(
                remaining || 5
            )
        );


    /* =================================================
       SHOW WINNER
    ================================================= */

    document
        .getElementById(
            "winner"
        )
        .classList
        .add(
            "show"
        );
}

/* =========================================================
   WINNING CARTELA
========================================================= */

function renderWinnerCartela(
    cardNumber
){

    const area =
        document.getElementById(
            "winnerCartela"
        );


    if(!area){
        return;
    }


    area.innerHTML = "";


    const number =
        Number(cardNumber);


    const card =
        allCards[number] ||
        allCards[String(number)];


    /* =================================================
       CARTELA NOT LOADED YET
    ================================================= */

    if(!Array.isArray(card)){

        area.innerHTML = `
            <div
                style="
                    color:#aaa;
                    font-size:11px;
                    padding:10px;
                "
            >
                Loading winning Cartela...
            </div>
        `;

        return;
    }


    /* =================================================
       TITLE
    ================================================= */

    const title =
        document.createElement(
            "div"
        );


    title.className =
        "winner-cartela-title";


    title.textContent =
        "Winning Cartela";


    area.appendChild(
        title
    );


    /* =================================================
       GRID
    ================================================= */

    const grid =
        document.createElement(
            "div"
        );


    grid.className =
        "winner-cartela-grid";


    /* =================================================
       B I N G O HEADER
    ================================================= */

    [
        "B",
        "I",
        "N",
        "G",
        "O"
    ].forEach(
        (
            letterValue,
            i
        ) => {

            const cell =
                document.createElement(
                    "div"
                );


            cell.className =
                "winner-cartela-letter " +
                [
                    "b",
                    "i",
                    "n",
                    "g",
                    "o"
                ][i];


            cell.textContent =
                letterValue;


            grid.appendChild(
                cell
            );

        }
    );


    /* =================================================
       5 × 5 CARTELA
    ================================================= */

    for(
        let i = 0;
        i < 25;
        i++
    ){

        const cell =
            document.createElement(
                "div"
            );


        cell.className =
            "winner-cartela-cell";


        const value =
            card[i];


        /* =============================================
           FREE CENTER
        ============================================= */

        if(
            value === "FREE" ||
            i === 12
        ){

            cell.classList.add(
                "free"
            );


            cell.textContent =
                "✦";

        }else{

            cell.textContent =
                value;


            /* =========================================
               HIGHLIGHT CALLED NUMBERS
            ========================================= */

            if(
                calledNumbers.includes(
                    Number(value)
                )
            ){

                cell.classList.add(
                    "called"
                );

            }

        }


        grid.appendChild(
            cell
        );

    }


    area.appendChild(
        grid
    );
}
/* =========================================================
   AUTOMATIC MODE
========================================================= */

async function setAutomatic(
    value
){

    automatic =
        value;


    const sw =
        document.getElementById(
            "autoSwitch"
        );


    const button =
        document.getElementById(
            "modeButton"
        );


    if(automatic){

        sw.classList.add(
            "on"
        );

        button.textContent =
            "Automatic";

        button.classList.remove(
            "manual"
        );

    }else{

        sw.classList.remove(
            "on"
        );

        button.textContent =
            "Manual";

        button.classList.add(
            "manual"
        );
    }


    if(
        myCardNumbers.length
    ){

        try{

            await fetch(
                API +
                "/api/set-mode",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            player_id:
                                playerId,

                            mode:
                                automatic
                                    ? "automatic"
                                    : "manual"
                        })
                }
            );

        }catch(error){

            console.log(
                error
            );
        }
    }


    renderCard();
}


/* =========================================================
   SWITCH CLICK
========================================================= */

document
    .getElementById(
        "autoSwitch"
    )
    .addEventListener(
        "click",
        () => {

            setAutomatic(
                !automatic
            );

        }
    );


document
    .getElementById(
        "modeButton"
    )
    .addEventListener(
        "click",
        () => {

            setAutomatic(
                !automatic
            );

        }
    );


/* =========================================================
   REFRESH
========================================================= */

document
    .getElementById(
        "refreshBtn"
    )
    .addEventListener(
        "click",
        async () => {

            await loadGame();

            await loadCards();

        }
    );


/* =========================================================
   LEAVE
========================================================= */

document
    .getElementById(
        "leaveBtn"
    )
    .addEventListener(
        "click",
        () => {

            sessionStorage.setItem(
                "bingoPlayerId",
                playerId
            );

            window.location.href =
                "cartela.html";

        }
    );

/* =========================================================
   START
========================================================= */

renderNumberBoard();

loadGame();

loadCards();


/*
 * Live updates.
 */

setInterval(
    loadGame,
    1000
);


setInterval(
    loadCards,
    2000
);

</script>
