<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beteseb Bingo - Cartela Selection</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#090b18,#15102b,#090b18);
    color:white;
    min-height:100vh;
    padding:12px;
}

.container{
    max-width:700px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:12px;
}

.header h1{
    font-size:25px;
    color:#9b7cff;
}

.header p{
    font-size:13px;
    color:#aaa;
    margin-top:4px;
}

.info{
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#171a2d;
    border:1px solid #292d49;
    border-radius:12px;
    padding:10px 12px;
    margin-bottom:10px;
}

.timer{
    font-size:22px;
    font-weight:bold;
    color:#ffd54a;
}

.timer.locked{
    color:#ff5555;
    font-size:17px;
}

.selected-info{
    font-size:13px;
    color:#ccc;
}

.cards{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:6px;
}

.card{
    border:1px solid #343852;
    background:#1b1e31;
    border-radius:7px;
    padding:10px 2px;
    text-align:center;
    font-weight:bold;
    font-size:13px;
    cursor:pointer;
    transition:.15s;
    min-height:40px;
}

.card.available:hover{
    background:#252a45;
}

.card.selected{
    background:#d7a900;
    color:#111;
    border-color:#ffe066;
}

.card.reserved{
    background:#9c2020;
    color:white;
    border-color:#ff5b5b;
    cursor:not-allowed;
}

.card.disabled{
    background:#282b38;
    color:#777;
    cursor:not-allowed;
}

.preview{
    margin-top:12px;
    background:#15182a;
    border:1px solid #292d49;
    border-radius:12px;
    padding:12px;
}

.preview h2{
    text-align:center;
    font-size:16px;
    margin-bottom:8px;
}

.bingo-card{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:4px;
    max-width:330px;
    margin:auto;
}

.cell{
    aspect-ratio:1;
    background:#22263b;
    border-radius:5px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:bold;
}

.cell.head{
    background:#5940a5;
}

.cell.free{
    background:#6e4dd8;
    font-size:10px;
}

.message{
    text-align:center;
    min-height:20px;
    margin-top:8px;
    font-size:13px;
    color:#aaa;
}

.status{
    text-align:center;
    margin-top:8px;
    font-size:12px;
    color:#777;
}

@media(max-width:500px){
    body{
        padding:8px;
    }

    .cards{
        grid-template-columns:repeat(6,1fr);
        gap:4px;
    }

    .card{
        padding:8px 1px;
        font-size:11px;
        min-height:36px;
    }

    .header h1{
        font-size:22px;
    }

    .timer{
        font-size:19px;
    }

    .selected-info{
        font-size:12px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <h1>🎱 Beteseb Bingo</h1>
        <p>Select up to 3 Cartelas</p>
    </div>

    <div class="info">
        <div>
            <div class="selected-info">Selected: <b id="selectedCount">0</b>/3</div>
            <div class="selected-info">Round: <b id="roundNumber">1</b></div>
        </div>

        <div id="timer" class="timer">40</div>
    </div>

    <div id="cards" class="cards"></div>

    <div id="preview" class="preview" style="display:none;">
        <h2 id="previewTitle">Cartela</h2>
        <div id="previewCard" class="bingo-card"></div>
    </div>

    <div id="message" class="message"></div>

    <div class="status">
        After the timer ends, everyone automatically enters the game.
        <br>
        No Cartela = Watch Only
    </div>

</div>

<script>

const API = "https://zo-bingo.onrender.com";

let selectedCards = [];
let cardsData = {};
let gameStatus = "picking";
let currentRound = 1;
let remaining = 40;

const maxCards = 3;

const cardsContainer = document.getElementById("cards");
const selectedCount = document.getElementById("selectedCount");
const timerEl = document.getElementById("timer");
const messageEl = document.getElementById("message");
const preview = document.getElementById("preview");
const previewTitle = document.getElementById("previewTitle");
const previewCard = document.getElementById("previewCard");
const roundNumber = document.getElementById("roundNumber");


/* ---------------- PLAYER ID ---------------- */

function getPlayerId(){

    let id = localStorage.getItem("beteseb_player_id");

    if(!id){

        id =
            "player_" +
            Date.now() +
            "_" +
            Math.random().toString(36).substring(2,9);

        localStorage.setItem("beteseb_player_id",id);
    }

    return id;
}

const playerId = getPlayerId();


/* ---------------- LOAD GAME ---------------- */

async function loadGame(){

    try{

        const response =
            await fetch(API + "/api/game-status");

        const data = await response.json();

        if(!data.success) return;

        gameStatus = data.status;
        currentRound = data.round;

        remaining =
            Number(data.remaining || 0);

        roundNumber.textContent =
            currentRound;

        updateTimer();

        if(gameStatus === "picking"){

            renderCards(data.players || {});

        }else{

            renderCards(data.players || {});
        }

        /*
        IMPORTANT:
        When picking finishes, automatically
        move everyone to play.html.
        */

        if(gameStatus === "playing"){

            saveSelectedCards();

            window.location.href =
                "play.html";

            return;
        }

    }catch(error){

        console.log(error);

        messageEl.textContent =
            "Connecting to game...";
    }
}


/* ---------------- TIMER ---------------- */

function updateTimer(){

    if(gameStatus === "picking"){

        timerEl.textContent =
            Math.max(0,remaining);

        timerEl.classList.remove("locked");

    }else{

        timerEl.textContent =
            "LOCKED";

        timerEl.classList.add("locked");
    }
}


/* ---------------- LOAD CARDS ---------------- */

async function loadCards(){

    try{

        const response =
            await fetch(API + "/api/cards");

        const data =
            await response.json();

        if(data.success){

            cardsData =
                data.cards || {};

            /*
            Restore this player's selections
            from the server.
            */

            if(Array.isArray(data.my_cards)){

                selectedCards =
                    data.my_cards.map(Number);
            }

            renderCards(data.players || {});
        }

    }catch(error){

        console.log(error);
    }
}


/* ---------------- RENDER ---------------- */

function renderCards(players){

    cardsContainer.innerHTML = "";

    for(let i=1;i<=96;i++){

        const button =
            document.createElement("div");

        button.className = "card";

        button.textContent =
            i;

        const owner =
            players[String(i)];

        if(owner){

            if(owner === playerId){

                button.classList.add("selected");

            }else{

                button.classList.add("reserved");
            }

        }else{

            if(gameStatus === "picking"){

                button.classList.add("available");

            }else{

                button.classList.add("disabled");
            }
        }

        button.addEventListener(
            "click",
            () => selectCard(i)
        );

        cardsContainer.appendChild(button);
    }

    selectedCount.textContent =
        selectedCards.length;
}


/* ---------------- SELECT / DESELECT ---------------- */

async function selectCard(cardNumber){

    if(gameStatus !== "picking"){

        showMessage(
            "Cartela selection is closed."
        );

        return;
    }

    /*
    If already selected:
    clicking it again = DESELECT
    */

    if(selectedCards.includes(cardNumber)){

        await deselectCard(cardNumber);

        return;
    }

    /*
    Maximum 3 Cartelas
    */

    if(selectedCards.length >= maxCards){

        showMessage(
            "You can select maximum 3 Cartelas."
        );

        return;
    }

    try{

        const response =
            await fetch(
                API + "/api/select-card",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({

                        player_id:
                            playerId,

                        card_number:
                            cardNumber

                    })
                }
            );

        const data =
            await response.json();

        if(data.success){

            if(!selectedCards.includes(cardNumber)){

                selectedCards.push(cardNumber);
            }

            saveSelectedCards();

            showMessage(
                "Cartela " +
                cardNumber +
                " selected."
            );

            renderCards(data.players || {});

        }else{

            showMessage(
                data.message ||
                "Cartela is not available."
            );
        }

    }catch(error){

        console.log(error);

        showMessage(
            "Connection error."
        );
    }
}


/* ---------------- DESELECT ---------------- */

async function deselectCard(cardNumber){

    try{

        const response =
            await fetch(
                API + "/api/deselect-card",
                {
                    method:"POST",
                    headers:{
                        "Content-Type":
                            "application/json"
                    },
                    body:JSON.stringify({

                        player_id:
                            playerId,

                        card_number:
                            cardNumber
                    })
                }
            );

        const data =
            await response.json();

        if(data.success){

            selectedCards =
                selectedCards.filter(
                    n => n !== cardNumber
                );

            saveSelectedCards();

            showMessage(
                "Cartela " +
                cardNumber +
                " deselected."
            );

            renderCards(data.players || {});

        }else{

            showMessage(
                data.message ||
                "Could not deselect."
            );
        }

    }catch(error){

        console.log(error);

        showMessage(
            "Connection error."
        );
    }
}


/* ---------------- SAVE ---------------- */

function saveSelectedCards(){

    sessionStorage.setItem(
        "bingoSelectedCards",
        JSON.stringify(selectedCards)
    );
}


/* ---------------- PREVIEW ---------------- */

function previewCardNumber(number){

    const card =
        cardsData[String(number)];

    if(!card){

        preview.style.display =
            "none";

        return;
    }

    preview.style.display =
        "block";

    previewTitle.textContent =
        "Cartela " + number;

    previewCard.innerHTML = "";

    const headers =
        ["B","I","N","G","O"];

    headers.forEach(letter => {

        const cell =
            document.createElement("div");

        cell.className =
            "cell head";

        cell.textContent =
            letter;

        previewCard.appendChild(cell);
    });

    const numbers =
        Array.isArray(card)
            ? card
            : card.numbers || [];

    numbers.forEach((value,index) => {

        const cell =
            document.createElement("div");

        cell.className =
            "cell";

        if(index === 12){

            cell.classList.add("free");

            cell.textContent =
                "FREE";

        }else{

            cell.textContent =
                value;
        }

        previewCard.appendChild(cell);
    });
}


/* ---------------- MESSAGE ---------------- */

function showMessage(text){

    messageEl.textContent =
        text;

    setTimeout(() => {

        if(messageEl.textContent === text){

            messageEl.textContent = "";
        }

    },2500);
}


/* ---------------- CLICK PREVIEW ---------------- */

cardsContainer.addEventListener(
    "click",
    event => {

        const card =
            event.target.closest(".card");

        if(!card) return;

        const number =
            Number(card.textContent);

        if(number){

            previewCardNumber(number);
        }
    }
);


/* ---------------- START ---------------- */

loadCards();
loadGame();

setInterval(
    loadGame,
    1000
);

setInterval(
    loadCards,
    1000
);

</script>

</body>
</html>
